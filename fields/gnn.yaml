# Field configuration contract.
#
# Every field the pipeline can be pointed at is one file in this directory.
# Nothing else in the repository may contain field-specific knowledge: the
# crawler, the model and the narrative prompts all read their subject matter
# from here. To add a field, copy this file and change the values.
#

name: gnn
display_name: Graph Neural Networks

# Passed verbatim into narrative prompts, so it must read as prose rather than
# as a keyword list.
description: >
  Neural network architectures that operate directly on graph-structured data,
  learning representations of nodes, edges and whole graphs by propagating
  information along the edges of the graph.

# OpenAlex topic the field is delimited by. Topics superseded the older
# `concepts` taxonomy, which OpenAlex has deprecated and no longer populates.
topic_id: T11273  # "Advanced Graph Neural Networks"

# Papers the snowball crawl starts from. OpenAlex work IDs.
seed_papers:
  - W2116341502  # The Graph Neural Network Model (2008)
  - W1662382123  # Spectral Networks and Locally Connected Networks on Graphs (2013)
  - W2173027866  # Convolutional Networks on Graphs for Learning Molecular Fingerprints (2015)
  - W2244807774  # Gated Graph Sequence Neural Networks (2015)
  - W2519887557  # Semi-Supervised Classification with Graph Convolutional Networks (2016)
  - W2606780347  # Neural Message Passing for Quantum Chemistry (2017)
  - W2624431344  # Inductive Representation Learning on Large Graphs (2017)
  - W2766453196  # Graph Attention Networks (2017)

# Works dropped at cleaning: OpenAlex records whose metadata is wrong in a way
# the pipeline cannot detect, so they would surface in rankings under a name
# that is not theirs.
exclude_works:
  - W2964015378  # cited 2347 times inside the graph, titled as a 2025 vulnerability-detection paper

# OpenAlex records filed under another work's title. Cleaning restores the
# title and drops the abstract, which came from the same wrong record.
corrected_titles:
  # ChebNet (Defferrard et al., 2016), filed as a GSP'18 workshop lecture.
  W2964321699: Convolutional Neural Networks on Graphs with Fast Localized Spectral Filtering

crawl:
  # How many citation hops to expand outward from the seeds.
  hop_depth: 2
  # How many hops forward, to the works citing the seeds. Only works under
  # topic_id are taken in, or the crawl would follow every field that ever
  # cited a seed.
  forward_depth: 1
  # Works outside the crawl that this many crawled works cite, such as an
  # attention mechanism from machine translation, are fetched too, but not
  # followed. Neither direction of the crawl would reach them otherwise.
  fill_cited_by: 20
  # Publication years to keep. Bounds are inclusive; null means unbounded.
  date_range:
    start: 1980
    end: 2025
