[project]
name = "rootcite"
version = "0.1.0"
description = "Trace a paper back to its structural originators in a citation graph."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12,<3.13"
dependencies = [
    "httpx>=0.28.1",
    "networkx>=3.6.1",
    "pandas>=3.0.5",
    "pyarrow>=25.0.1",
    "pydantic>=2.13.5",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
notebooks = [
    "ipykernel>=7.3.0",
    "matplotlib>=3.11.1",
]

[dependency-groups]
dev = [
    "pre-commit>=4.0",
    "pytest>=8.3",
    "ruff>=0.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/api", "src/gnn", "src/graph", "src/llm"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["B", "E", "F", "I", "N", "SIM", "UP", "W"]

[tool.ruff.lint.per-file-ignores]
# A notebook has to put the source tree on sys.path before it can import from it.
"notebooks/*.ipynb" = ["E402"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
