[project]
name = "rootcite"
version = "0.1.0"
description = "Trace a paper back to its structural originators in a citation graph."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12,<3.13"
dependencies = [
    "anthropic>=1.3.0",
    "httpx>=0.28.1",
    "langgraph>=1.2.11",
    "networkx>=3.6.1",
    "openai>=3.8.0",
    "pandas>=3.0.5",
    "pyarrow>=25.0.1",
    "pydantic>=2.13.5",
    "pyyaml>=6.0",
    "torch>=2.14.0",
    "torch-geometric>=2.8.0.post1",
]

[project.optional-dependencies]
notebooks = [
    "ipykernel>=7.3.0",
    "matplotlib>=3.11.1",
]

[dependency-groups]
dev = [
    "pre-commit>=4.0",
    "pytest>=8.3",
    "ruff>=0.9",
]

# Linux wheels on PyPI carry a bundled CUDA runtime; this project only ever runs
# the model on CPU, and the CUDA payload is most of a gigabyte of CI cache.
[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/api", "src/gnn", "src/graph", "src/llm"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["B", "E", "F", "I", "N", "SIM", "UP", "W"]

[tool.ruff.lint.per-file-ignores]
# A notebook has to put the source tree on sys.path before it can import from it.
"notebooks/*.ipynb" = ["E402"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
